<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Astral de Alta Precisão</title>
    <!-- Carregamento Assíncrono da Biblioteca de Astronomia -->
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            color: #58a6ff;
        }

        .controls {
            background: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            max-width: 650px;
            width: 100%;
            justify-content: center;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 130px;
        }

        .input-group.full-width {
            flex: 100%;
        }

        label {
            font-size: 0.85rem;
            color: #8b949e;
        }

        input, select {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #58a6ff;
        }

        .location-box {
            display: flex;
            gap: 8px;
        }

        .location-box input {
            flex: 1;
        }

        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background-color: #30363d;
        }

        .btn-primary {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        .canvas-container {
            position: relative;
            width: 500px;
            height: 500px;
            margin-bottom: 30px;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .results {
            width: 100%;
            max-width: 700px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #30363d;
        }

        th {
            color: #58a6ff;
            font-weight: 600;
        }

        tr:hover {
            background-color: #21262d;
        }

        .symbol {
            font-size: 1.2rem;
            margin-right: 8px;
        }

        .status-msg {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h1>Mapa Astral de Alta Precisão</h1>

    <div class="controls">
        <div class="input-group">
            <label for="date">Data de Nascimento</label>
            <input type="date" id="date" value="1991-01-25">
        </div>
        <div class="input-group">
            <label for="time">Horário Local</label>
            <input type="time" id="time" value="17:10">
        </div>
        <div class="input-group">
            <label for="tz">Fuso / H. Verão</label>
            <select id="tz">
                <option value="-3">UTC-3 (Oficial)</option>
                <option value="-2" selected>UTC-2 (H. Verão)</option>
                <option value="-4">UTC-4</option>
                <option value="0">UTC+0 (GMT)</option>
            </select>
        </div>

        <div class="input-group full-width">
            <label for="citySearch">Cidade, Estado e País</label>
            <div class="location-box">
                <input type="text" id="citySearch" placeholder="Ex: Curitiba, PR, Brasil" value="Curitiba, PR, Brasil">
                <button type="button" class="btn-secondary" onclick="usarGPS()">📍 Usar GPS</button>
            </div>
            <div id="statusMsg" class="status-msg">Iniciando sistema...</div>
        </div>

        <input type="hidden" id="lat" value="-25.4284">
        <input type="hidden" id="lon" value="-49.2733">

        <button class="btn-primary" onclick="processarEMapa()">Gerar Mapa</button>
    </div>

    <div class="canvas-container">
        <canvas id="astroCanvas" width="500" height="500"></canvas>
    </div>

    <div class="results">
        <table>
            <thead>
                <tr>
                    <th>Astro</th>
                    <th>Posição Zodiacal</th>
                    <th>Signo</th>
                    <th>Casa</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </div>

    <script>
        const SIGNOS = [
            { nome: "Áries", simbolo: "♈" },
            { nome: "Touro", simbolo: "♉" },
            { nome: "Gêmeos", simbolo: "♊" },
            { nome: "Câncer", simbolo: "♋" },
            { nome: "Leão", simbolo: "♌" },
            { nome: "Virgem", simbolo: "♍" },
            { nome: "Libras", simbolo: "♎" },
            { nome: "Escorpião", simbolo: "♏" },
            { nome: "Sagitário", simbolo: "♐" },
            { nome: "Capricórnio", simbolo: "♑" },
            { nome: "Aquário", simbolo: "♒" },
            { nome: "Peixes", simbolo: "♓" }
        ];

        const ASTROS_CONFIG = [
            { id: "Sun", nome: "Sol", simbolo: "☉", cor: "#ffd700" },
            { id: "Moon", nome: "Lua", simbolo: "☽", cor: "#e6e6fa" },
            { id: "Mercury", nome: "Mercúrio", simbolo: "☿", cor: "#b0c4de" },
            { id: "Venus", nome: "Vênus", simbolo: "♀", cor: "#ffb6c1" },
            { id: "Mars", nome: "Marte", simbolo: "♂", cor: "#ff4500" },
            { id: "Jupiter", nome: "Júpiter", simbolo: "♃", cor: "#ffa500" },
            { id: "Saturn", nome: "Saturno", simbolo: "♄", cor: "#daa520" },
            { id: "Uranus", nome: "Urano", simbolo: "♅", cor: "#7fffd4" },
            { id: "Neptune", nome: "Netuno", simbolo: "♆", cor: "#1e90ff" },
            { id: "Pluto", nome: "Plutão", simbolo: "♇", cor: "#9370db" }
        ];

        const bgImage = new Image();
        bgImage.src = 'roda.png';

        function normalizar(graus) {
            graus = graus % 360;
            return graus < 0 ? graus + 360 : graus;
        }

        async function buscarCoordenadas(cidade) {
            const status = document.getElementById('statusMsg');
            status.textContent = "Buscando localização...";
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cidade)}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    document.getElementById('lat').value = data[0].lat;
                    document.getElementById('lon').value = data[0].lon;
                    status.textContent = `Localizado: ${data[0].display_name.split(',')[0]}`;
                    return true;
                }
            } catch (err) {}
            status.textContent = "Local padrão utilizado.";
            return false;
        }

        function usarGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById('lat').value = pos.coords.latitude;
                    document.getElementById('lon').value = pos.coords.longitude;
                    document.getElementById('citySearch').value = "Minha Localização Atual";
                    calcularMapa();
                });
            }
        }

        async function processarEMapa() {
            const cidade = document.getElementById('citySearch').value;
            if (cidade && cidade !== "Minha Localização Atual") {
                await buscarCoordenadas(cidade);
            }
            calcularMapa();
        }

        function getEclipticLongitude(body, date) {
            if (body === "Sun") {
                return Astronomy.SunPosition(date).lon;
            }
            const pos = Astronomy.GeoVector(body, date, true);
            const ecl = Astronomy.Ecliptic(pos);
            return ecl.elon;
        }

        function calcularAngulos(date, lat, lon) {
            const siderealTimeHours = Astronomy.SiderealTime(date);
            const lstDegrees = normalizar((siderealTimeHours * 15) + lon);

            const radLST = lstDegrees * Math.PI / 180;
            const radLat = lat * Math.PI / 180;
            const obliq = 23.439 * Math.PI / 180;

            // Meio do Céu (MC)
            let mc = Math.atan2(Math.sin(radLST), Math.cos(radLST) * Math.cos(obliq)) * 180 / Math.PI;
            mc = normalizar(mc);

            // Ascendente (AC)
            const y = Math.cos(radLST);
            const x = -Math.sin(radLST) * Math.cos(obliq) - Math.tan(radLat) * Math.sin(obliq);
            let asc = Math.atan2(y, x) * 180 / Math.PI;
            asc = normalizar(asc);

            return { asc, mc };
        }

        function calcularMapa() {
            const status = document.getElementById('statusMsg');
            
            if (typeof Astronomy === 'undefined') {
                status.textContent = "Erro: Biblioteca astronômica ainda não carregou. Aguarde um instante...";
                return;
            }

            const dateVal = document.getElementById('date').value;
            const timeVal = document.getElementById('time').value;
            const tzOffset = parseFloat(document.getElementById('tz').value);
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);

            if (!dateVal || !timeVal) return;

            const [year, month, day] = dateVal.split('-').map(Number);
            const [hours, minutes] = timeVal.split(':').map(Number);

            const utcTime = Date.UTC(year, month - 1, day, hours - tzOffset, minutes);
            const dateObj = new Date(utcTime);

            const astroDate = new Astronomy.Date(dateObj);
            const { asc, mc } = calcularAngulos(astroDate, lat, lon);

            const posicoes = ASTROS_CONFIG.map(astro => {
                const lonEcliptica = normalizar(getEclipticLongitude(astro.id, astroDate));
                const signoIndex = Math.floor(lonEcliptica / 30);
                const grauNoSigno = lonEcliptica % 30;

                const diffAsc = normalizar(lonEcliptica - asc);
                const casa = Math.floor(diffAsc / 30) + 1;

                return {
                    ...astro,
                    grauAbsoluto: lonEcliptica,
                    signo: SIGNOS[signoIndex],
                    grauNoSigno: grauNoSigno,
                    casa: casa
                };
            });

            desenharCanvas(posicoes);
            preencherTabela(posicoes, asc, mc);
            status.textContent = "Mapa gerado com sucesso!";
        }

        function desenharCanvas(posicoes) {
            const canvas = document.getElementById('astroCanvas');
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const raioPlanetas = 160;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }

            posicoes.forEach(astro => {
                let anguloRad = (astro.grauAbsoluto - 90) * (Math.PI / 180);
                let x = cx + raioPlanetas * Math.cos(anguloRad);
                let y = cy + raioPlanetas * Math.sin(anguloRad);

                ctx.beginPath();
                ctx.arc(x, y, 13, 0, 2 * Math.PI);
                ctx.fillStyle = '#0d1117';
                ctx.fill();
                ctx.strokeStyle = astro.cor;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = astro.cor;
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(astro.simbolo, x, y);
            });
        }

        function formatarGraus(grausDecimal) {
            const g = Math.floor(grausDecimal);
            const m = Math.floor((grausDecimal - g) * 60);
            const s = Math.floor((((grausDecimal - g) * 60) - m) * 60);
            return `${g}° ${m.toString().padStart(2, '0')}' ${s.toString().padStart(2, '0')}"`;
        }

        function preencherTabela(posicoes, asc, mc) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // 1. Linha do Ascendente
            const ascIndex = Math.floor(asc / 30);
            const trAsc = document.createElement('tr');
            trAsc.style.fontWeight = "bold";
            trAsc.style.color = "#58a6ff";
            trAsc.innerHTML = `
                <td><span class="symbol">AC</span> Ascendente</td>
                <td>${formatarGraus(asc % 30)} ${SIGNOS[ascIndex].simbolo}</td>
                <td>${SIGNOS[ascIndex].nome}</td>
                <td>Casa 1</td>
            `;
            tbody.appendChild(trAsc);

            // 2. Linha do Meio do Céu
            const mcIndex = Math.floor(mc / 30);
            const trMc = document.createElement('tr');
            trMc.style.fontWeight = "bold";
            trMc.style.color = "#58a6ff";
            trMc.innerHTML = `
                <td><span class="symbol">MC</span> Meio do Céu</td>
                <td>${formatarGraus(mc % 30)} ${SIGNOS[mcIndex].simbolo}</td>
                <td>${SIGNOS[mcIndex].nome}</td>
                <td>Casa 10</td>
            `;
            tbody.appendChild(trMc);

            // 3. Demais Planetas
            posicoes.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="symbol" style="color:${p.cor}">${p.simbolo}</span> ${p.nome}</td>
                    <td>${formatarGraus(p.grauNoSigno)} ${p.signo.simbolo}</td>
                    <td>${p.signo.nome}</td>
                    <td>Casa ${p.casa}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Garante a inicialização assim que o script da CDN estiver disponível
        window.addEventListener('load', () => {
            bgImage.onload = () => {
                setTimeout(calcularMapa, 200); // Dá uma leve margem para a CDN registrar o objeto Astronomy
            };
            if (bgImage.complete) {
                setTimeout(calcularMapa, 200);
            }
        });
    </script>
</body>
</html>
