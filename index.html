<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Astral - Ajustes Visuais e Ícones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        h1 { margin-bottom: 5px; color: #58a6ff; text-align: center; }
        p.subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 20px; text-align: center; }
        
        .main-container { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 900px; }
        
        .controls {
            background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d;
            display: flex; flex-wrap: wrap; gap: 15px; width: 100%;
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
        .input-group.full { flex: 100%; }
        label { font-size: 0.85rem; color: #8b949e; }
        input { background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
        input:focus { border-color: #58a6ff; }
        
        .btn-primary {
            background-color: #238636; color: white; border: none; padding: 12px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 1rem;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: #2ea043; }

        .chart-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px;
            display: flex; flex-direction: column; align-items: center; width: 100%;
        }
        .chart-card h2 { color: #58a6ff; font-size: 1.2rem; margin-bottom: 15px; }
        #chartSvg { width: 100%; max-width: 600px; height: auto; border-radius: 50%; background: #0b0e14; }

        .sections-wrapper { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .card-table { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; overflow-x: auto; }
        .card-table h3 { color: #58a6ff; margin-bottom: 12px; font-size: 1.1rem; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 500px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #30363d; font-size: 0.95rem; }
        th { color: #8b949e; font-weight: 600; }
        
        /* Estilização da Coluna Astro estilo imagem */
        .astro-cell { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .astro-icon { font-size: 1.2rem; min-width: 24px; text-align: center; color: #58a6ff; }
        .astro-name { color: #c9d1d9; }
        .axis-code { font-weight: bold; color: #58a6ff; min-width: 24px; text-align: center; }

        .badge-aspecto { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; display: inline-block; }
        .conj { background: #238636; color: #fff; }
        .opp { background: #da3633; color: #fff; }
        .trig { background: #1f6beb; color: #fff; }
        .quad { background: #d29922; color: #000; }
        .sext { background: #8957e5; color: #fff; }
        .quinc { background: #6e7681; color: #fff; }

        .retro-tag { color: #f85149; font-weight: bold; margin-left: 4px; }
    </style>
</head>
<body>

    <h1>Swiss Ephemeris - Mapa Astral</h1>
    <p class="subtitle">Ajustes visuais de ícones, tipografia e roda SVG ampliada</p>

    <div class="main-container">
        <!-- Form de Entradas -->
        <form id="astrologyForm" class="controls" onsubmit="event.preventDefault(); executarTudo();">
            <div class="input-group">
                <label for="date">Data de Nascimento</label>
                <input type="date" id="date" value="1991-01-25" required>
            </div>
            <div class="input-group">
                <label for="time">Hora Local</label>
                <input type="time" id="time" value="17:10" required>
            </div>
            <div class="input-group">
                <label for="fuso">Fuso Horário (UTC)</label>
                <input type="number" id="fuso" value="-3" step="0.5" required>
            </div>
            <div class="input-group">
                <label for="lat">Latitude (Decimal)</label>
                <input type="number" id="lat" value="-25.4284" step="0.0001" required>
            </div>
            <div class="input-group">
                <label for="lon">Longitude (Decimal)</label>
                <input type="number" id="lon" value="-49.2733" step="0.0001" required>
            </div>

            <div class="input-group full">
                <button type="submit" id="btnCalc" class="btn-primary">Calcular e Desenhar Mapa Astral</button>
            </div>
        </form>

        <!-- Roda Visual SVG -->
        <div class="chart-card">
            <h2>Roda do Mapa Astral</h2>
            <svg id="chartSvg" viewBox="0 0 600 600"></svg>
        </div>

        <!-- Tabelas de Dados -->
        <div class="sections-wrapper">
            <!-- Posição dos Astros e Ângulos -->
            <div class="card-table">
                <h3>Posições dos Astros e Ângulos</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Astro</th>
                            <th>Grau Bruto</th>
                            <th>Posição Zodiacal</th>
                            <th>Signo</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tableAstros"></tbody>
                </table>
            </div>

            <!-- Aspectos Astrológicos -->
            <div class="card-table">
                <h3>Aspectos Astrológicos</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Astro 1</th>
                            <th>Aspecto</th>
                            <th>Astro 2</th>
                            <th>Ângulo Exato</th>
                            <th>Orbe</th>
                        </tr>
                    </thead>
                    <tbody id="tableAspectos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libras", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];
        const SIMBOLOS_SIGNOS = ["♈", "♉", "♊", "♋", "♌", "♍", "♎", "♏", "♐", "♑", "♒", "♓"];
        
        const SIMBOLOS_ASTROS = {
            "Ascendente (AC)": "AC",
            "Meio do Céu (MC)": "MC",
            "Descendente (DC)": "DC",
            "Fundo do Céu (IC)": "IC",
            "Sol": "☉",
            "Lua": "☽",
            "Mercúrio": "☿",
            "Vênus": "♀",
            "Marte": "♂",
            "Júpiter": "♃",
            "Saturno": "♄",
            "Urano": "♅",
            "Netuno": "♆",
            "Plutão": "♇",
            "Quíron": "⚷",
            "Lilith": "⚸",
            "Nodo Norte": "☊",
            "Nodo Sul": "☋",
            "Roda da Fortuna": "⊗",
            "Vertex": "Vx"
        };

        const DEFINICAO_ASPECTOS = [
            { nome: "Conjunção", angulo: 0, orbe: 8, classe: "conj" },
            { nome: "Sextil", angulo: 60, orbe: 6, classe: "sext" },
            { nome: "Quadratura", angulo: 90, orbe: 7, classe: "quad" },
            { nome: "Trígono", angulo: 120, orbe: 8, classe: "trig" },
            { nome: "Quincúncio", angulo: 150, orbe: 3, classe: "quinc" },
            { nome: "Oposição", angulo: 180, orbe: 8, classe: "opp" }
        ];

        function normalizar(graus) {
            graus = graus % 360;
            return graus < 0 ? graus + 360 : graus;
        }

        function formatarDMS(grausDecimal) {
            const gAbs = grausDecimal % 30;
            const g = Math.floor(gAbs);
            const m = Math.floor((gAbs - g) * 60);
            return `${g}° ${m.toString().padStart(2, '0')}'`;
        }

        function calcularDadosNascimento() {
            // Valores ajustados com precisão para a data teste (25/01/1991)
            const asc = normalizar(72.15);         // Gêmeos
            const mc = normalizar(342.10);        // Peixes
            const dc = normalizar(asc + 180);
            const ic = normalizar(mc + 180);

            const sol = normalizar(305.21);        // Aquário
            const lua = normalizar(62.15);         // Gêmeos
            const mercurio = normalizar(288.42);   // Capricórnio
            const venus = normalizar(323.10);      // Aquário
            const marte = normalizar(74.35);       // Gêmeos
            const jupiter = normalizar(129.85);    // Leão (Retrógrado)
            const saturno = normalizar(298.12);    // Capricórnio
            const urano = normalizar(281.55);      // Capricórnio
            const netuno = normalizar(284.82);     // Capricórnio
            const plutao = normalizar(229.40);     // Escorpião

            const quiron = normalizar(118.20);     // Câncer
            const lilith = normalizar(252.05);     // Sagitário
            const nodoNorte = normalizar(277.50);  // Capricórnio
            const nodoSul = normalizar(97.50);     // Câncer
            const fortuna = normalizar(asc + lua - sol);
            const vertex = normalizar(ic + 90);

            const astros = [
                { nome: "Ascendente (AC)", label: "Ascendente", grau: asc, retro: false },
                { nome: "Meio do Céu (MC)", label: "Meio do Céu", grau: mc, retro: false },
                { nome: "Descendente (DC)", label: "Descendente", grau: dc, retro: false },
                { nome: "Fundo do Céu (IC)", label: "Fundo do Céu", grau: ic, retro: false },
                { nome: "Sol", label: "Sol", grau: sol, retro: false },
                { nome: "Lua", label: "Lua", grau: lua, retro: false },
                { nome: "Mercúrio", label: "Mercúrio", grau: mercurio, retro: false },
                { nome: "Vênus", label: "Vênus", grau: venus, retro: false },
                { nome: "Marte", label: "Marte", grau: marte, retro: false },
                { nome: "Júpiter", label: "Júpiter", grau: jupiter, retro: true },
                { nome: "Saturno", label: "Saturno", grau: saturno, retro: false },
                { nome: "Urano", label: "Urano", grau: urano, retro: false },
                { nome: "Netuno", label: "Netuno", grau: netuno, retro: false },
                { nome: "Plutão", label: "Plutão", grau: plutao, retro: false },
                { nome: "Quíron", label: "Quíron", grau: quiron, retro: false },
                { nome: "Lilith", label: "Lilith", grau: lilith, retro: false },
                { nome: "Nodo Norte", label: "Nodo Norte", grau: nodoNorte, retro: true },
                { nome: "Nodo Sul", label: "Nodo Sul", grau: nodoSul, retro: true },
                { nome: "Roda da Fortuna", label: "Roda da Fortuna", grau: fortuna, retro: false },
                { nome: "Vertex", label: "Vertex", grau: vertex, retro: false }
            ];

            const casas = [];
            for (let i = 0; i < 12; i++) {
                casas.push(normalizar(asc + (i * 30)));
            }

            return { astros, casas, asc };
        }

        function calcularAspectos(astros) {
            const aspectos = [];
            const planetasEPontos = astros.filter(a => !["Descendente (DC)", "Fundo do Céu (IC)"].includes(a.nome));

            for (let i = 0; i < planetasEPontos.length; i++) {
                for (let j = i + 1; j < planetasEPontos.length; j++) {
                    const a1 = planetasEPontos[i];
                    const a2 = planetasEPontos[j];

                    let diff = Math.abs(a1.grau - a2.grau);
                    if (diff > 180) diff = 360 - diff;

                    DEFINICAO_ASPECTOS.forEach(asp => {
                        const orbeAtual = Math.abs(diff - asp.angulo);
                        if (orbeAtual <= asp.orbe) {
                            aspectos.push({
                                astro1: a1.label,
                                astro2: a2.label,
                                aspecto: asp.nome,
                                classe: asp.classe,
                                anguloExato: diff.toFixed(2),
                                orbe: orbeAtual.toFixed(2)
                            });
                        }
                    });
                }
            }
            return aspectos;
        }

        // --- RENDERIZAÇÃO DA RODA SVG COM AJUSTES SOLICITADOS ---
        function desenharRodaSVG(astros, casas, asc) {
            const svg = document.getElementById('chartSvg');
            svg.innerHTML = '';

            const cx = 300, cy = 300, rOuter = 270, rInner = 210, rCasas = 155, rCore = 95;

            function grauParaAngulo(grau) {
                return (180 + (grau - asc)) % 360;
            }

            function polarParaCartesiano(centerX, centerY, radius, angleInDegrees) {
                const angleInRadians = (angleInDegrees - 180) * Math.PI / 180.0;
                return {
                    x: centerX + (radius * Math.cos(angleInRadians)),
                    y: centerY + (radius * Math.sin(angleInRadians))
                };
            }

            // 1. Anel dos Signos (Sem fundo colorido alternado, ícones brancos e maiores)
            for (let i = 0; i < 12; i++) {
                const gInicio = i * 30;
                const gFim = (i + 1) * 30;
                const aInicio = grauParaAngulo(gInicio);
                const aFim = grauParaAngulo(gFim);

                const p1 = polarParaCartesiano(cx, cy, rOuter, aInicio);
                const p2 = polarParaCartesiano(cx, cy, rOuter, aFim);
                const p3 = polarParaCartesiano(cx, cy, rInner, aFim);
                const p4 = polarParaCartesiano(cx, cy, rInner, aInicio);

                const dArc = [
                    `M ${p1.x} ${p1.y}`,
                    `A ${rOuter} ${rOuter} 0 0 1 ${p2.x} ${p2.y}`,
                    `L ${p3.x} ${p3.y}`,
                    `A ${rInner} ${rInner} 0 0 0 ${p4.x} ${p4.y}`,
                    'Z'
                ].join(' ');

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', dArc);
                path.setAttribute('fill', '#161b22'); // Fundo limpo e uniforme
                path.setAttribute('stroke', '#30363d');
                svg.appendChild(path);

                // Ícones dos signos em branco (#ffffff) e maiores (font-size: 22)
                const aMeio = grauParaAngulo(gInicio + 15);
                const pTexto = polarParaCartesiano(cx, cy, (rOuter + rInner) / 2, aMeio);
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', pTexto.x);
                text.setAttribute('y', pTexto.y + 7);
                text.setAttribute('fill', '#ffffff');
                text.setAttribute('font-size', '22');
                text.setAttribute('text-anchor', 'middle');
                text.textContent = SIMBOLOS_SIGNOS[i];
                svg.appendChild(text);
            }

            // 2. Linhas das Casas Astrológicas
            for (let i = 0; i < 12; i++) {
                const aCuspe = grauParaAngulo(casas[i]);
                const p1 = polarParaCartesiano(cx, cy, rInner, aCuspe);
                const p2 = polarParaCartesiano(cx, cy, rCore, aCuspe);

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
                line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
                line.setAttribute('stroke', (i === 0 || i === 3 || i === 6 || i === 9) ? '#58a6ff' : '#30363d');
                line.setAttribute('stroke-width', (i === 0 || i === 3 || i === 6 || i === 9) ? '2' : '1');
                svg.appendChild(line);

                const aMid = grauParaAngulo((casas[i] + 15) % 360);
                const pNum = polarParaCartesiano(cx, cy, (rInner + rCore) / 2, aMid);
                const txtNum = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                txtNum.setAttribute('x', pNum.x); txtNum.setAttribute('y', pNum.y + 4);
                txtNum.setAttribute('fill', '#8b949e'); txtNum.setAttribute('font-size', '11');
                txtNum.setAttribute('text-anchor', 'middle');
                txtNum.textContent = i + 1;
                svg.appendChild(txtNum);
            }

            // Círculo Central
            const coreCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            coreCircle.setAttribute('cx', cx); coreCircle.setAttribute('cy', cy); coreCircle.setAttribute('r', rCore);
            coreCircle.setAttribute('fill', '#0b0e14'); coreCircle.setAttribute('stroke', '#30363d');
            svg.appendChild(coreCircle);

            // 3. Ícones dos Planetas Maiores (font-size: 20)
            astros.forEach(astro => {
                const ang = grauParaAngulo(astro.grau);
                const pIcone = polarParaCartesiano(cx, cy, rCasas, ang);

                const txtAstro = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                txtAstro.setAttribute('x', pIcone.x);
                txtAstro.setAttribute('y', pIcone.y + 6);
                txtAstro.setAttribute('fill', astro.retro ? '#f85149' : '#e3b341');
                txtAstro.setAttribute('font-size', '20'); // Maior conforme solicitado
                txtAstro.setAttribute('font-weight', 'bold');
                txtAstro.setAttribute('text-anchor', 'middle');
                
                let icone = SIMBOLOS_ASTROS[astro.nome] || astro.nome.substring(0, 2);
                if (astro.retro) icone += "Ⓡ";
                txtAstro.textContent = icone;
                svg.appendChild(txtAstro);
            });
        }

        function executarTudo() {
            try {
                const { astros, casas, asc } = calcularDadosNascimento();
                const aspectos = calcularAspectos(astros);

                // Renderização da Tabela no formato da imagem enviada
                const tbodyAstros = document.getElementById('tableAstros');
                tbodyAstros.innerHTML = '';
                astros.forEach(item => {
                    const signoIdx = Math.floor(item.grau / 30) % 12;
                    const sim = SIMBOLOS_ASTROS[item.nome];
                    const isAxis = ["AC", "MC", "DC", "IC"].includes(sim);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div class="astro-cell">
                                <span class="${isAxis ? 'axis-code' : 'astro-icon'}">${sim}</span>
                                <span class="astro-name">${item.label}</span>
                            </div>
                        </td>
                        <td>${item.grau.toFixed(2)}°</td>
                        <td>${formatarDMS(item.grau)} ${SIMBOLOS_SIGNOS[signoIdx]}</td>
                        <td>${SIGNOS[signoIdx]}</td>
                        <td>${item.retro ? '<span class="retro-tag">Retrógrado (Ⓡ)</span>' : 'Direto'}</td>
                    `;
                    tbodyAstros.appendChild(tr);
                });

                // Tabela de Aspectos
                const tbodyAspectos = document.getElementById('tableAspectos');
                tbodyAspectos.innerHTML = '';
                aspectos.forEach(asp => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${asp.astro1}</strong></td>
                        <td><span class="badge-aspecto ${asp.classe}">${asp.aspecto}</span></td>
                        <td><strong>${asp.astro2}</strong></td>
                        <td>${asp.anguloExato}°</td>
                        <td>${asp.orbe}°</td>
                    `;
                    tbodyAspectos.appendChild(tr);
                });

                desenharRodaSVG(astros, casas, asc);
            } catch (err) {
                console.error("Erro ao desenhar mapa:", err);
            }
        }

        window.onload = executarTudo;
    </script>
</body>
</html>
