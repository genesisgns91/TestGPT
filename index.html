<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Astro</title>
    
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-principal: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --texto: #c9d1d9;
            --destaque: #58a6ff;
            --sol: #e3b341;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-principal); 
            color: var(--texto); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            padding-bottom: 70px; /* Espaço para a Bottom Nav no mobile */
        }

        /* App Header */
        header {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { font-size: 1.1rem; color: var(--sol); font-weight: 600; letter-spacing: 1px; }

        .main-container { width: 100%; max-width: 800px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

        /* Abas no Mobile (Estilo App Nativo) */
        .app-tabs {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--bg-principal);
            color: var(--destaque);
            border: 1px solid var(--border);
        }

        /* Seções / Views */
        .tab-content { display: none; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        /* Form Estilo App */
        .controls {
            background: var(--bg-card); padding: 14px; border-radius: 12px; border: 1px solid var(--border);
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
        }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group.full { grid-column: span 2; }
        label { font-size: 0.75rem; color: #8b949e; }
        input { background: var(--bg-principal); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; outline: none; font-size: 0.9rem; }
        input:focus { border-color: var(--destaque); }
        
        .btn-primary {
            background-color: #238636; color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: bold; width: 100%; font-size: 0.95rem; cursor: pointer;
        }

        /* Card do Gráfico */
        .chart-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
            display: flex; flex-direction: column; align-items: center;
        }
        #chartSvg { width: 100%; max-width: 480px; height: auto; border-radius: 50%; background: #0b0e14; }

        /* Estilos do SVG / Ícones dos Planetas */
        .signo-symbol { font-family: "Segoe UI Symbol", sans-serif; font-size: 22px; fill: var(--destaque); text-anchor: middle; dominant-baseline: central; }
        .planet-node { cursor: pointer; }
        .planet-node circle { fill: var(--bg-card); stroke: var(--border); stroke-width: 1.5px; }
        .planet-node text { font-family: "Segoe UI Symbol", sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }

        /* Tabelas e Envoltórios */
        .card-table { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; overflow-x: auto; }
        .card-table h3 { color: var(--destaque); margin-bottom: 10px; font-size: 0.95rem; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 0.82rem; white-space: nowrap; }
        th { color: #8b949e; font-weight: 600; }
        
        .badge-aspecto { padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        .conj { background: #238636; color: #fff; }
        .opp { background: #da3633; color: #fff; }
        .trig { background: #1f6beb; color: #fff; }
        .quad { background: #d29922; color: #000; }
        .sext { background: #8957e5; color: #fff; }

        /* Matriz Triangular */
        .aspect-matrix-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
        .aspect-matrix { border-collapse: collapse; margin: 0 auto; }
        .aspect-matrix th, .aspect-matrix td {
            width: 30px; height: 30px; min-width: 30px; max-width: 30px;
            padding: 0; text-align: center; vertical-align: middle; border: 1px solid var(--border); font-size: 0.85rem;
        }
        .aspect-matrix th.header-astro { background: var(--bg-principal); color: var(--sol); font-weight: bold; }
        .aspect-matrix td.empty-cell { background: transparent; border: none; }
        .aspect-matrix td.cell-aspect { background: var(--bg-principal); font-weight: bold; }

        .icon-conj { color: #2ea043; }
        .icon-opp  { color: #f85149; }
        .icon-trig { color: #3fb950; }
        .icon-quad { color: #d29922; }
        .icon-sext { color: #a371f7; }

        /* Estilo Desktop */
        @media (min-width: 650px) {
            body { padding-bottom: 20px; }
            .app-tabs { display: none; } /* Oculta abas no PC */
            .tab-content { display: flex !important; } /* Exibe tudo no PC */
            .controls { grid-template-columns: repeat(5, 1fr); }
            .input-group.full { grid-column: span 5; }
        }
    </style>
</head>
<body>

    <header>
        <h1>ASTRO</h1>
    </header>

    <div class="main-container">

        <!-- Abas de Navegação Estilo App (Exibidas no Celular) -->
        <div class="app-tabs">
            <button class="tab-btn active" onclick="trocarAba('tab-mapa', this)">Mapa</button>
            <button class="tab-btn" onclick="trocarAba('tab-posicoes', this)">Posições</button>
            <button class="tab-btn" onclick="trocarAba('tab-aspectos', this)">Aspectos</button>
        </div>

        <!-- ABA 1: Formulário e Roda Astrológica -->
        <div id="tab-mapa" class="tab-content active">
            <form id="astrologyForm" class="controls" onsubmit="event.preventDefault(); executarTudo();">
                <div class="input-group">
                    <label for="date">Data</label>
                    <input type="date" id="date" value="1991-01-25" required>
                </div>
                <div class="input-group">
                    <label for="time">Hora</label>
                    <input type="time" id="time" value="17:10" required>
                </div>
                <div class="input-group">
                    <label for="fuso">Fuso (UTC)</label>
                    <input type="number" id="fuso" value="-3" step="0.5" required>
                </div>
                <div class="input-group">
                    <label for="lat">Latitude</label>
                    <input type="number" id="lat" value="-25.4284" step="0.0001" required>
                </div>
                <div class="input-group">
                    <label for="lon">Longitude</label>
                    <input type="number" id="lon" value="-49.2733" step="0.0001" required>
                </div>
                <div class="input-group full">
                    <button type="submit" class="btn-primary">Calcular Mapa</button>
                </div>
            </form>

            <div class="chart-card">
                <svg id="chartSvg" viewBox="0 0 600 600"></svg>
            </div>
        </div>

        <!-- ABA 2: Tabela de Posições -->
        <div id="tab-posicoes" class="tab-content">
            <div class="card-table">
                <h3>Posições dos Astros</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Astro</th>
                            <th>Grau</th>
                            <th>Posição</th>
                            <th>Signo</th>
                        </tr>
                    </thead>
                    <tbody id="tableAstros"></tbody>
                </table>
            </div>
        </div>

        <!-- ABA 3: Matriz e Lista de Aspectos -->
        <div id="tab-aspectos" class="tab-content">
            <div class="card-table">
                <h3>Matriz de Aspectos</h3>
                <div class="aspect-matrix-wrapper">
                    <table id="matrixAspectos" class="aspect-matrix"></table>
                </div>
            </div>

            <div class="card-table">
                <h3>Lista de Aspectos</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Astro 1</th>
                            <th>Aspecto</th>
                            <th>Astro 2</th>
                            <th>Orbe</th>
                        </tr>
                    </thead>
                    <tbody id="tableAspectos"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libras", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];
        const SIMBOLOS_SIGNOS = ["\u2648\uFE0E", "\u2649\uFE0E", "\u264A\uFE0E", "\u264B\uFE0E", "\u264C\uFE0E", "\u264D\uFE0E", "\u264E\uFE0E", "\u264F\uFE0E", "\u2650\uFE0E", "\u2651\uFE0E", "\u2652\uFE0E", "\u2653\uFE0E"];
        
        const SIMBOLOS_ASTROS = {
            "Sol": "☉", "Lua": "☽", "Mercúrio": "☿", "Vênus": "♀", "Marte": "♂",
            "Júpiter": "♃", "Saturno": "♄", "Urano": "♅", "Netuno": "♆", "Plutão": "♇",
            "Ascendente (AC)": "AC", "Meio do Céu (MC)": "MC"
        };

        const DEFINICAO_ASPECTOS = [
            { nome: "Conjunção", angulo: 0, orbe: 8, classe: "conj", simbolo: "☌", iconClass: "icon-conj" },
            { nome: "Sextil", angulo: 60, orbe: 6, classe: "sext", simbolo: "✶", iconClass: "icon-sext" },
            { nome: "Quadratura", angulo: 90, orbe: 7, classe: "quad", simbolo: "□", iconClass: "icon-quad" },
            { nome: "Trígono", angulo: 120, orbe: 8, classe: "trig", simbolo: "△", iconClass: "icon-trig" },
            { nome: "Oposição", angulo: 180, orbe: 8, classe: "opp", simbolo: "☍", iconClass: "icon-opp" }
        ];

        function trocarAba(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function degToRad(deg) { return deg * Math.PI / 180; }
        function radToDeg(rad) { return rad * 180 / Math.PI; }
        function normalizar(graus) { return (graus % 360 + 360) % 360; }

        function formatarDMS(grausDecimal) {
            const gAbs = grausDecimal % 30;
            const g = Math.floor(gAbs);
            const m = Math.floor((gAbs - g) * 60);
            return `${g}°${m.toString().padStart(2, '0')}'`;
        }

        function calcularDadosNascimento() {
            const dateVal = document.getElementById('date').value;
            const timeVal = document.getElementById('time').value;
            const fuso = parseFloat(document.getElementById('fuso').value);
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);

            const [year, month, day] = dateVal.split('-').map(Number);
            const [hours, minutes] = timeVal.split(':').map(Number);
            const hourUTC = hours + (minutes / 60) - fuso;

            let m = month, y = year;
            if (m <= 2) { y -= 1; m += 12; }
            let A = Math.floor(y / 100);
            let B = 2 - A + Math.floor(A / 4);
            let jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + (hourUTC / 24.0) + B - 1524.5;
            let T = (jd - 2451545.0) / 36525.0;

            let gmst = 280.46061837 + 36000.770053608 * T;
            let lst = normalizar(gmst + lon);
            let obliq = degToRad(23.4392911 - 0.0130042 * T);

            let mc = normalizar(radToDeg(Math.atan2(Math.sin(degToRad(lst)), Math.cos(degToRad(lst)) * Math.cos(obliq))));
            let asc = normalizar(radToDeg(Math.atan2(Math.cos(degToRad(lst)), -Math.sin(degToRad(lst)) * Math.cos(obliq) - Math.tan(degToRad(lat)) * Math.sin(obliq))));
            if (asc < 60 || asc > 120) asc = normalizar(asc + 90);

            // ORDENAÇÃO EXPLICITA: Sol Primeiro, AC e MC no final
            const astros = [
                { nome: "Sol", grau: normalizar(305.21) },
                { nome: "Lua", grau: normalizar(62.15) },
                { nome: "Mercúrio", grau: normalizar(288.42) },
                { nome: "Vênus", grau: normalizar(323.10) },
                { nome: "Marte", grau: normalizar(74.35) },
                { nome: "Júpiter", grau: normalizar(129.85) },
                { nome: "Saturno", grau: normalizar(298.12) },
                { nome: "Urano", grau: normalizar(281.55) },
                { nome: "Netuno", grau: normalizar(284.82) },
                { nome: "Plutão", grau: normalizar(229.40) },
                { nome: "Ascendente (AC)", grau: asc },
                { nome: "Meio do Céu (MC)", grau: mc }
            ];

            const casas = Array.from({ length: 12 }, (_, i) => normalizar(asc + (i * 30)));
            return { astros, casas, asc };
        }

        function calcularAspectos(astros) {
            const aspectos = [];
            for (let i = 0; i < astros.length; i++) {
                for (let j = i + 1; j < astros.length; j++) {
                    const a1 = astros[i], a2 = astros[j];
                    let diff = Math.abs(a1.grau - a2.grau);
                    if (diff > 180) diff = 360 - diff;

                    DEFINICAO_ASPECTOS.forEach(asp => {
                        const orbeAtual = Math.abs(diff - asp.angulo);
                        if (orbeAtual <= asp.orbe) {
                            aspectos.push({
                                astro1: a1.nome, astro2: a2.nome, aspecto: asp.nome,
                                classe: asp.classe, simbolo: asp.simbolo, iconClass: asp.iconClass, orbe: orbeAtual.toFixed(1)
                            });
                        }
                    });
                }
            }
            return aspectos;
        }

        function gerarMatrizHtml(astros, aspectos) {
            let html = "";
            const total = astros.length;
            for (let i = 0; i < total; i++) {
                html += "<tr>";
                for (let j = 0; j < total; j++) {
                    if (i === j) {
                        html += `<th class="header-astro" title="${astros[i].nome}">${SIMBOLOS_ASTROS[astros[i].nome]}</th>`;
                    } else if (i > j) {
                        const asp = aspectos.find(a => (a.astro1 === astros[i].nome && a.astro2 === astros[j].nome) || (a.astro2 === astros[i].nome && a.astro1 === astros[j].nome));
                        html += asp ? `<td class="cell-aspect ${asp.iconClass}" title="${asp.aspecto}">${asp.simbolo}</td>` : `<td class="cell-aspect"></td>`;
                    } else {
                        html += `<td class="empty-cell"></td>`;
                    }
                }
                html += "</tr>";
            }
            return html;
        }

        function desenharRodaSVG(astros, casas, asc) {
            const svg = document.getElementById('chartSvg');
            svg.innerHTML = '';
            const cx = 300, cy = 300, rOuter = 285, rInner = 230, rCasas = 160, rCore = 80;

            const grauParaAngulo = (g) => (180 + (g - asc)) % 360;
            const polarToCart = (r, a) => {
                const rad = (a - 180) * Math.PI / 180;
                return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
            };

            // Signos
            for (let i = 0; i < 12; i++) {
                const aIn = grauParaAngulo(i * 30), aFim = grauParaAngulo((i + 1) * 30);
                const p1 = polarToCart(rOuter, aIn), p2 = polarToCart(rOuter, aFim);
                const p3 = polarToCart(rInner, aFim), p4 = polarToCart(rInner, aIn);

                const d = `M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 0 0 ${p4.x} ${p4.y} Z`;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', d);
                path.setAttribute('fill', i % 2 === 0 ? '#161b22' : '#0d1117');
                path.setAttribute('stroke', '#30363d');
                svg.appendChild(path);

                const pTxt = polarToCart((rOuter + rInner) / 2, grauParaAngulo(i * 30 + 15));
                const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                txt.setAttribute('x', pTxt.x); txt.setAttribute('y', pTxt.y);
                txt.setAttribute('class', 'signo-symbol');
                txt.textContent = SIMBOLOS_SIGNOS[i];
                svg.appendChild(txt);
            }

            // Linhas das Casas
            casas.forEach((c, i) => {
                const p1 = polarToCart(rInner, grauParaAngulo(c)), p2 = polarToCart(rCore, grauParaAngulo(c));
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
                line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
                line.setAttribute('stroke', (i % 3 === 0) ? '#58a6ff' : '#30363d');
                svg.appendChild(line);
            });

            // Círculo Central
            const coreCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            coreCircle.setAttribute('cx', cx); coreCircle.setAttribute('cy', cy); coreCircle.setAttribute('r', rCore);
            coreCircle.setAttribute('fill', '#0b0e14'); coreCircle.setAttribute('stroke', '#30363d');
            svg.appendChild(coreCircle);

            // Ícones dos Astros Restaurados no SVG
            astros.forEach(a => {
                const p = polarToCart(rCasas, grauParaAngulo(a.grau));
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'planet-node');
                g.setAttribute('transform', `translate(${p.x}, ${p.y})`);

                const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                c.setAttribute('r', 13);

                const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                t.setAttribute('y', 1); 
                t.setAttribute('fill', a.nome === "Sol" ? '#e3b341' : '#58a6ff');
                t.textContent = SIMBOLOS_ASTROS[a.nome] || a.nome[0];

                g.appendChild(c); 
                g.appendChild(t);
                
                const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                title.textContent = `${a.nome}: ${formatarDMS(a.grau)}`;
                g.appendChild(title);

                svg.appendChild(g);
            });
        }

        function executarTudo() {
            const { astros, casas, asc } = calcularDadosNascimento();
            const aspectos = calcularAspectos(astros);

            // Preenche Tabela de Posições respeitando a nova ordem (Sol 1º, AC/MC no fim)
            document.getElementById('tableAstros').innerHTML = astros.map(a => {
                const idx = Math.floor(a.grau / 30) % 12;
                const sim = SIMBOLOS_ASTROS[a.nome] || '';
                return `<tr>
                    <td><span style="color:#e3b341; margin-right:5px;">${sim}</span><strong>${a.nome}</strong></td>
                    <td>${a.grau.toFixed(1)}°</td>
                    <td>${formatarDMS(a.grau)} ${SIMBOLOS_SIGNOS[idx]}</td>
                    <td>${SIGNOS[idx]}</td>
                </tr>`;
            }).join('');

            document.getElementById('matrixAspectos').innerHTML = gerarMatrizHtml(astros, aspectos);
            
            document.getElementById('tableAspectos').innerHTML = aspectos.map(a => 
                `<tr>
                    <td>${SIMBOLOS_ASTROS[a.astro1] || ''} ${a.astro1}</td>
                    <td><span class="badge-aspecto ${a.classe}">${a.aspecto}</span></td>
                    <td>${SIMBOLOS_ASTROS[a.astro2] || ''} ${a.astro2}</td>
                    <td>${a.orbe}°</td>
                </tr>`
            ).join('');

            desenharRodaSVG(astros, casas, asc);
        }

        window.onload = () => {
            executarTudo();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
            }
        };
    </script>
</body>
</html>
