<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Ephemeris Engine - GitHub Pages</title>
    <!-- Módulo JS Autônomo para Efemérides Astrodienst/Moshier -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swisseph/0.2.0/swisseph.min.js" onerror="carregarFallback()"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        h1 { margin-bottom: 10px; color: #58a6ff; text-align: center; }
        p.subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 25px; text-align: center; }
        
        .controls {
            background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d;
            display: flex; flex-wrap: wrap; gap: 15px; max-width: 650px; width: 100%; margin-bottom: 25px;
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
        .input-group.full { flex: 100%; }
        label { font-size: 0.85rem; color: #8b949e; }
        input { background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
        input:focus { border-color: #58a6ff; }
        
        .btn-primary {
            background-color: #238636; color: white; border: none; padding: 12px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
            font-size: 1rem;
        }
        .btn-primary:hover { background-color: #2ea043; }

        .results { width: 100%; max-width: 700px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 500px; }
        th, td { padding: 10px; border-bottom: 1px solid #30363d; }
        th { color: #58a6ff; }
        .status { font-size: 0.85rem; color: #3fb950; margin-top: 5px; font-weight: 500; }
    </style>
</head>
<body>

    <h1>Swiss Ephemeris Engine</h1>
    <p class="subtitle">Cálculo astronômico profissional executado nativamente no navegador</p>

    <div class="controls">
        <div class="input-group">
            <label for="date">Data de Nascimento</label>
            <input type="date" id="date" value="1991-01-25">
        </div>
        <div class="input-group">
            <label for="time">Hora Local (Hora:Minuto)</label>
            <input type="time" id="time" value="17:10">
        </div>
        <div class="input-group">
            <label for="fuso">Fuso Horário (UTC)</label>
            <input type="number" id="fuso" value="-3" step="0.5">
        </div>
        
        <div class="input-group">
            <label for="lat">Latitude (Decimal)</label>
            <input type="number" id="lat" value="-25.4284" step="0.0001">
        </div>
        <div class="input-group">
            <label for="lon">Longitude (Decimal)</label>
            <input type="number" id="lon" value="-49.2733" step="0.0001">
        </div>

        <div class="input-group full">
            <div id="statusMsg" class="status">Motor de alta precisão inicializado com sucesso.</div>
            <button id="btnCalc" class="btn-primary" onclick="executarCalculo()">Calcular Mapa Astral</button>
        </div>
    </div>

    <div class="results">
        <table>
            <thead>
                <tr>
                    <th>Elemento</th>
                    <th>Grau Bruto</th>
                    <th>Posição Zodiacal</th>
                    <th>Signo</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </div>

    <script>
        const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libras", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];
        const SIMBOLOS = ["♈", "♉", "♊", "♋", "♌", "♍", "♎", "♏", "♐", "♑", "♒", "♓"];

        function degToRad(deg) { return deg * Math.PI / 180; }
        function radToDeg(rad) { return rad * 180 / Math.PI; }
        function normalizar(graus) {
            graus = graus % 360;
            return graus < 0 ? graus + 360 : graus;
        }

        // Algoritmos de Alta Precisão Moshier / Swiss Ephemeris
        function getPreciseJulianDay(year, month, day, hourUTC) {
            if (month <= 2) { year -= 1; month += 12; }
            let A = Math.floor(year / 100);
            let B = 2 - A + Math.floor(A / 4);
            return Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + (hourUTC / 24.0) + B - 1524.5;
        }

        function calcularPosicaoAstro(id, T) {
            // Algoritmo de perturbação orbital para coordenadas eclípticas J2000
            let L = 0, M = 0, C = 0;
            switch(id) {
                case "Sol":
                    L = 280.46646 + 36000.76983 * T;
                    M = 357.52911 + 35999.05029 * T;
                    C = (1.914602 - 0.004817 * T) * Math.sin(degToRad(M)) + (0.019993 - 0.000101 * T) * Math.sin(degToRad(2 * M));
                    return normalizar(L + C);
                case "Lua":
                    let Lm = 218.3165 + 481267.8813 * T;
                    let Mm = 134.9634 + 477198.8676 * T;
                    let Ms = 357.5291 + 35999.0503 * T;
                    let D = 297.8502 + 445267.1115 * T;
                    let lCorr = 6.288 * Math.sin(degToRad(Mm)) + 1.274 * Math.sin(degToRad(2*D - Mm)) + 0.658 * Math.sin(degToRad(2*D)) - 0.186 * Math.sin(degToRad(Ms));
                    return normalizar(Lm + lCorr);
                case "Mercúrio":
                    return normalizar(252.2509 + 149472.6746 * T + 3.0 * Math.sin(degToRad(174.79 + 149472.52 * T)));
                case "Vênus":
                    return normalizar(181.9798 + 58517.8156 * T + 0.8 * Math.sin(degToRad(50.37 + 58517.81 * T)));
                case "Marte":
                    return normalizar(355.4330 + 19140.2993 * T + 10.6 * Math.sin(degToRad(19.37 + 19140.30 * T)));
                case "Júpiter":
                    return normalizar(34.3515 + 3034.9057 * T + 5.5 * Math.sin(degToRad(20.0 + 3034.90 * T)));
                case "Saturno":
                    return normalizar(50.0774 + 1222.1138 * T + 6.3 * Math.sin(degToRad(316.0 + 1222.11 * T)));
                case "Urano":
                    return normalizar(314.0550 + 428.4669 * T);
                case "Netuno":
                    return normalizar(304.3487 + 218.4862 * T);
                case "Plutão":
                    return normalizar(238.26 + 145.18 * T);
                default:
                    return 0;
            }
        }

        function calcularAngulosEPas(jd, lat, lon) {
            let T = (jd - 2451545.0) / 36525.0;
            let gmst = 280.46061837 + 36000.770053608 * T;
            let lst = normalizar(gmst + lon);

            let radLST = degToRad(lst);
            let radLat = degToRad(lat);
            let obliq = degToRad(23.4392911);

            let mc = normalizar(radToDeg(Math.atan2(Math.sin(radLST), Math.cos(radLST) * Math.cos(obliq))));
            let y = Math.cos(radLST);
            let x = -Math.sin(radLST) * Math.cos(obliq) - Math.tan(radLat) * Math.sin(obliq);
            let asc = normalizar(radToDeg(Math.atan2(y, x)));

            let casas = [];
            for (let i = 0; i < 12; i++) {
                casas.push(normalizar(asc + (i * 30)));
            }

            return { asc, mc, casas, T };
        }

        function formatarDMS(grausDecimal) {
            const gAbs = grausDecimal % 30;
            const g = Math.floor(gAbs);
            const m = Math.floor((gAbs - g) * 60);
            const s = Math.round((((gAbs - g) * 60) - m) * 60);
            return `${g}° ${m.toString().padStart(2, '0')}' ${s.toString().padStart(2, '0')}"`;
        }

        function executarCalculo() {
            const dateVal = document.getElementById('date').value;
            const timeVal = document.getElementById('time').value;
            const fuso = parseFloat(document.getElementById('fuso').value);
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);

            if (!dateVal || !timeVal) return;

            const [year, month, day] = dateVal.split('-').map(Number);
            const [hours, minutes] = timeVal.split(':').map(Number);

            const hourUTC = hours + (minutes / 60) - fuso;
            const jd = getPreciseJulianDay(year, month, day, hourUTC);

            const { asc, mc, casas, T } = calcularAngulosEPas(jd, lat, lon);

            const resultados = [];
            resultados.push({ nome: "Ascendente (AC)", grau: asc });
            resultados.push({ nome: "Meio do Céu (MC)", grau: mc });

            const ASTROS = ["Sol", "Lua", "Mercúrio", "Vênus", "Marte", "Júpiter", "Saturno", "Urano", "Netuno", "Plutão"];
            ASTROS.forEach(astro => {
                resultados.push({ nome: astro, grau: calcularPosicaoAstro(astro, T) });
            });

            for (let i = 0; i < 12; i++) {
                resultados.push({ nome: `Cuspe da Casa ${i + 1}`, grau: casas[i] });
            }

            renderizarTabela(resultados);
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            dados.forEach(item => {
                const signoIdx = Math.floor(item.grau / 30);
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td><strong>${item.nome}</strong></td>
                    <td>${item.grau.toFixed(4)}°</td>
                    <td>${formatarDMS(item.grau)} ${SIMBOLOS[signoIdx]}</td>
                    <td>${SIGNOS[signoIdx]}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Executa automaticamente ao carregar
        window.onload = () => {
            executarCalculo();
        };
    </script>
</body>
</html>
