<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Astrológico Swiss Ephemeris WASM</title>
    <!-- Carregamento do Módulo WebAssembly da Swiss Ephemeris via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/swisseph-wasm@0.2.1/dist/swisseph.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        h1 { margin-bottom: 10px; color: #58a6ff; }
        p.subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 25px; }
        
        .controls {
            background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d;
            display: flex; flex-wrap: wrap; gap: 15px; max-width: 650px; width: 100%; margin-bottom: 25px;
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
        .input-group.full { flex: 100%; }
        label { font-size: 0.85rem; color: #8b949e; }
        input { background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
        input:focus { border-color: #58a6ff; }
        
        .btn-primary {
            background-color: #238636; color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
        }
        .btn-primary:hover { background-color: #2ea043; }
        .btn-primary:disabled { background-color: #21262d; color: #8b949e; cursor: not-allowed; }

        .results { width: 100%; max-width: 700px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid #30363d; }
        th { color: #58a6ff; }
        .status { font-size: 0.85rem; color: #e3b341; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>Swiss Ephemeris WASM Engine</h1>
    <p class="subtitle">Cálculo astronômico em C++ executado nativamente no navegador via WebAssembly</p>

    <div class="controls">
        <div class="input-group">
            <label for="date">Data de Nascimento</label>
            <input type="date" id="date" value="1991-01-25">
        </div>
        <div class="input-group">
            <label for="time">Hora Local (Hora:Minuto)</label>
            <input type="time" id="time" value="17:10">
        </div>
        <div class="input-group">
            <label for="fuso">Fuso Horário (UTC)</label>
            <input type="number" id="fuso" value="-3" step="0.5">
        </div>
        
        <div class="input-group">
            <label for="lat">Latitude (Decimal)</label>
            <input type="number" id="lat" value="-25.4284" step="0.0001">
        </div>
        <div class="input-group">
            <label for="lon">Longitude (Decimal)</label>
            <input type="number" id="lon" value="-49.2733" step="0.0001">
        </div>

        <div class="input-group full">
            <div id="statusMsg" class="status">Carregando motor WebAssembly...</div>
            <button id="btnCalc" class="btn-primary" onclick="executarCalculo()" disabled>Calcular Mapa Astral</button>
        </div>
    </div>

    <div class="results">
        <table>
            <thead>
                <tr>
                    <th>Elemento</th>
                    <th>Grau Bruto (0°-360°)</th>
                    <th>Posição Zodiacal</th>
                    <th>Signo</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align: center; color: #8b949e;">Aguardando inicialização do WASM...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libras", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];
        const SIMBOLOS = ["♈", "♉", "♊", "♋", "♌", "♍", "♎", "♏", "♐", "♑", "♒", "♓"];

        let sweModule = null;

        // 1. Inicializar o Módulo WebAssembly assim que a página carregar
        window.addEventListener('DOMContentLoaded', async () => {
            const status = document.getElementById('statusMsg');
            try {
                if (typeof SwissEph === 'undefined') {
                    throw new Error("Não foi possível carregar o arquivo da CDN.");
                }
                
                // Instancia o binário em C compilado em WASM
                sweModule = await SwissEph();
                status.textContent = "Motor Swiss Ephemeris WASM pronto!";
                status.style.color = "#3fb950";
                document.getElementById('btnCalc').disabled = false;
                
                // Executa um cálculo inicial
                executarCalculo();
            } catch (err) {
                status.textContent = "Erro ao carregar WASM: " + err.message;
                status.style.color = "#f85149";
            }
        });

        function formatarDMS(grausDecimal) {
            const gAbs = grausDecimal % 30;
            const g = Math.floor(gAbs);
            const m = Math.floor((gAbs - g) * 60);
            const s = Math.round((((gAbs - g) * 60) - m) * 60);
            return `${g}° ${m.toString().padStart(2, '0')}' ${s.toString().padStart(2, '0')}"`;
        }

        // 2. Executar os Cálculos do Mapa Astral
        function executarCalculo() {
            if (!sweModule) return;

            const dateVal = document.getElementById('date').value;
            const timeVal = document.getElementById('time').value;
            const fuso = parseFloat(document.getElementById('fuso').value);
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);

            const [year, month, day] = dateVal.split('-').map(Number);
            const [hours, minutes] = timeVal.split(':').map(Number);

            // Converter Horário Local para Hora UTC em decimal
            let utcHours = hours + (minutes / 60) - fuso;
            
            // a) Calcular Julian Day (swe_julday)
            const julDay = sweModule.swe_julday(year, month, day, utcHours, sweModule.SE_GREG_CAL);

            const resultados = [];

            // b) Calcular Casas Astrológicas e Ângulos (Placidus = 'P')
            // Retorna array de cuspes e array de ascmc (Asc, MC, Armc, Vertex, etc.)
            const houses = sweModule.swe_houses(julDay, lat, lon, 'P');
            
            resultados.push({
                nome: "Ascendente (AC)",
                grau: houses.ascmc[0]
            });

            resultados.push({
                nome: "Meio do Céu (MC)",
                grau: houses.ascmc[1]
            });

            // c) Calcular Planetas
            const PLANETAS = [
                { id: sweModule.SE_SUN, nome: "Sol" },
                { id: sweModule.SE_MOON, nome: "Lua" },
                { id: sweModule.SE_MERCURY, nome: "Mercúrio" },
                { id: sweModule.SE_VENUS, nome: "Vênus" },
                { id: sweModule.SE_MARS, nome: "Marte" },
                { id: sweModule.SE_JUPITER, nome: "Júpiter" },
                { id: sweModule.SE_SATURN, nome: "Saturno" },
                { id: sweModule.SE_URANUS, nome: "Urano" },
                { id: sweModule.SE_NEPTUNE, nome: "Netuno" },
                { id: sweModule.SE_PLUTO, nome: "Plutão" }
            ];

            const flag = sweModule.SEFLG_SPEED; // Ativa cálculo de velocidade/precisão

            PLANETAS.forEach(p => {
                const calc = sweModule.swe_calc_ut(julDay, p.id, flag);
                resultados.push({
                    nome: p.nome,
                    grau: calc.longitude
                });
            });

            // d) Adicionar os Cuspes das 12 Casas
            for (let i = 1; i <= 12; i++) {
                resultados.push({
                    nome: `Cuspe da Casa ${i}`,
                    grau: houses.house[i]
                });
            }

            renderizarTabela(resultados);
        }

        // 3. Renderização Visual dos Dados
        function renderizarTabela(dados) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            dados.forEach(item => {
                const signoIdx = Math.floor(item.grau / 30);
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td><strong>${item.nome}</strong></td>
                    <td>${item.grau.toFixed(4)}°</td>
                    <td>${formatarDMS(item.grau)} ${SIMBOLOS[signoIdx]}</td>
                    <td>${SIGNOS[signoIdx]}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
