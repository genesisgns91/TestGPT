<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandala Astrológica & Análise IA</title>
    <style>
        :root {
            --fundo: #0d0f17;
            --card-bg: #161925;
            --texto: #e2e8f0;
            --subtexto: #94a3b8;
            --fogo: #ff5e57;
            --terra: #ffdd59;
            --ar: #0be881;
            --agua: #4bcffa;
            --borda: #2a2e3d;
            --ouro: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--fundo);
            color: var(--texto);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--ouro);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--subtexto);
            font-size: 0.95rem;
        }

        .grid-casas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }

        .casa-card {
            background-color: var(--card-bg);
            border: 1px solid var(--borda);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .casa-card:hover {
            transform: translateY(-2px);
            border-color: var(--ouro);
        }

        .casa-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--borda);
            padding-bottom: 8px;
        }

        .casa-titulo {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--ouro);
        }

        .select-signo {
            background-color: var(--fundo);
            color: var(--texto);
            border: 1px solid var(--borda);
            border-radius: 4px;
            padding: 8px;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            cursor: pointer;
        }

        .select-signo:focus {
            border-color: var(--ouro);
        }

        .btn-analisar {
            background-color: transparent;
            color: var(--ouro);
            border: 1px solid var(--ouro);
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
            margin-top: 5px;
        }

        .btn-analisar:hover {
            background-color: var(--ouro);
            color: var(--fundo);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--ouro);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--borda);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            color: var(--ouro);
            font-size: 1.2rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--subtexto);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--texto);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            line-height: 1.6;
            color: var(--texto);
        }

        .modal-body p {
            margin-bottom: 12px;
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
            gap: 15px;
            color: var(--subtexto);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--borda);
            border-top: 3px solid var(--ouro);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>✦ Mandala Astrológica ✦</h1>
            <p>Selecione a posição dos astros e gere interpretações com IA</p>
        </header>

        <div class="grid-casas" id="gridCasas">
            <!-- As casas astrológicas serão geradas dinamicamente via JS -->
        </div>
    </div>

    <!-- Modal para exibição das análises -->
    <div class="modal-overlay" id="aiModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Análise Astrológica</h3>
                <button class="close-btn" onclick="fecharModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Conteúdo gerado pela IA -->
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DA CHAVE DA API
        const GEMINI_API_KEY = "AQ.Ab8RN6LO4fi_Sn6NLpjl-x-Jo6Yni9O07FvF9RfYEEjSxnrtIw";

        const planetas = [
            "Sol", "Lua", "Mercúrio", "Vênus", "Marte", 
            "Júpiter", "Saturno", "Urano", "Netuno", "Plutão"
        ];

        const signos = [
            "Áries", "Touro", "Gêmeos", "Câncer", 
            "Leão", "Virgem", "Libras", "Escorpião", 
            "Sagitário", "Capricórnio", "Aquário", "Peixes"
        ];

        // Inicialização da interface
        function criarCards() {
            const grid = document.getElementById('gridCasas');
            grid.innerHTML = '';

            planetas.forEach((planeta, index) => {
                const casaNum = index + 1;
                const card = document.createElement('div');
                card.className = 'casa-card';
                card.innerHTML = `
                    <div class="casa-header">
                        <span class="casa-titulo">${planeta}</span>
                        <span style="color: var(--subtexto); font-size: 0.85rem;">Casa ${casaNum}</span>
                    </div>
                    <select class="select-signo" id="select-casa-${casaNum}">
                        <option value="">Selecione o Signo...</option>
                        ${signos.map(signo => `<option value="${signo}">${signo}</option>`).join('')}
                    </select>
                    <button class="btn-analisar" onclick="analisarPosicao('${planeta}', ${casaNum})">
                        ✦ Analisar Posição
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function analisarPosicao(planeta, casaNum) {
            const select = document.getElementById(`select-casa-${casaNum}`);
            const signoSelecionado = select.value;

            if (!signoSelecionado) {
                alert(`Por favor, selecione um signo para ${planeta} na Casa ${casaNum}.`);
                return;
            }

            const combinacao = `${planeta} em ${signoSelecionado} na Casa ${casaNum}`;
            gerarAnaliseIA(combinacao);
        }

        // INTEGRAÇÃO COM A API DO GEMINI
        async function gerarAnaliseIA(combinacao) {
            const modal = document.getElementById('aiModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = `✦ Análise: ${combinacao}`;
            modalBody.innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Consultando as estrelas com Gemini IA...</p>
                </div>
            `;
            modal.classList.add('active');

            const promptText = `Atue como um astrólogo experiente e analítico. Faça uma análise detalhada e perspicaz da seguinte posição astrológica: "${combinacao}". 

            Siga estas diretrizes de resposta:
            - Escreva de 2 a 3 parágrafos curtos.
            - Explique o significado psicológico, os desafios e os pontos fortes dessa combinação.
            - Use formatação HTML básica com parágrafos <p> e destaques em <strong> para facilitar a leitura.
            - Mantenha um tom profissional, acolhedor e profundo.`;

            const apiKey = GEMINI_API_KEY.trim();
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        contents: [
                            { 
                                parts: [{ text: promptText }] 
                            }
                        ]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    const errorMsg = data.error?.message || "Erro desconhecido na requisição.";
                    modalBody.innerHTML = `<p style="color:var(--fogo);"><strong>Erro na API (${response.status}):</strong> ${errorMsg}</p>`;
                    return;
                }

                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    let textResult = data.candidates[0].content.parts[0].text;
                    textResult = textResult.replace(/```html/g, '').replace(/```/g, '');
                    modalBody.innerHTML = textResult;
                } else {
                    modalBody.innerHTML = `<p style="color:var(--fogo);">Nenhuma resposta gerada pela IA.</p>`;
                }
            } catch (err) {
                console.error(err);
                modalBody.innerHTML = `<p style="color:var(--fogo);">Erro de conexão com o serviço: ${err.message}</p>`;
            }
        }

        function fecharModal() {
            document.getElementById('aiModal').classList.remove('active');
        }

        // Executa ao carregar a página
        window.onload = criarCards;
    </script>
</body>
</html>
