<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mapa Astral em JS Puro</title>

  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
    button { padding: 10px 20px; font-weight: bold; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #7dd3fc; }
    svg { background: #1e293b; border-radius: 50%; margin-top: 20px; }
    #resultado { margin-top: 20px; font-size: 1.1rem; }
  </style>
</head>
<body>

  <h1>Mapa Astral em JS Puro</h1>
  <button onclick="gerarMapa()">Gerar Posições dos Astros</button>

  <div>
    <svg id="rodaDoCeu" width="300" height="300" viewBox="-150 -150 300 300">
      <circle cx="0" cy="0" r="130" fill="none" stroke="#475569" stroke-width="2"/>
      <g id="camadaPlanetas"></g>
    </svg>
  </div>

  <div id="resultado"></div>

  <script>
    // Converte graus do zodíaco em coordenadas X,Y para o gráfico SVG
    function grausParaCoordenadas(raio, graus) {
      const radianos = (graus - 90) * (Math.PI / 180);
      return {
        x: raio * Math.cos(radianos),
        y: raio * Math.sin(radianos)
      };
    }

    // Algoritmo matemático para calcular a posição aproximada do Sol no zodíaco (0° = Áries)
    function obterGrauSol(data) {
      const inicioAno = new Date(data.getFullYear(), 0, 0);
      const diff = data - inicioAno;
      const diaDoAno = Math.floor(diff / (1000 * 60 * 60 * 24));
      // O equinócio de primavera no hemisfério norte (0° de Áries) ocorre por volta do dia 80 (21 de Março)
      let grau = (diaDoAno - 80) * (360 / 365.25);
      if (grau < 0) grau += 360;
      return grau % 360;
    }

    // Algoritmo para estimativa da posição da Lua (ciclo sideral de ~27.3 dias)
    function obterGrauLua(data) {
      const referencia = new Date(2000, 0, 1, 12, 0, 0); // Época J2000
      const diasDecorridos = (data - referencia) / (1000 * 60 * 60 * 24);
      let grau = (218.316 + 13.176396 * diasDecorridos) % 360;
      if (grau < 0) grau += 360;
      return grau;
    }

    function gerarMapa() {
      const agora = new Date();

      // Cálculos feitos internamente, sem depender de nenhuma biblioteca de fora
      const grauSol = obterGrauSol(agora);
      const grauLua = obterGrauLua(agora);

      const planetas = [
        { nome: "Sol", simbolo: "☉", graus: grauSol, cor: "#f59e0b" },
        { nome: "Lua", simbolo: "☽", graus: grauLua, cor: "#cbd5e1" }
      ];

      const camada = document.getElementById("camadaPlanetas");
      const divResultado = document.getElementById("resultado");
      
      camada.innerHTML = "";
      divResultado.innerHTML = "";

      planetas.forEach(p => {
        // 1. Calcula posição visual
        const pos = grausParaCoordenadas(110, p.graus);

        // 2. Cria o elemento de texto visual direto no SVG
        const textoSvg = document.createElementNS("http://www.w3.org/2000/svg", "text");
        textoSvg.setAttribute("x", pos.x);
        textoSvg.setAttribute("y", pos.y);
        textoSvg.setAttribute("fill", p.cor);
        textoSvg.setAttribute("font-size", "24");
        textoSvg.setAttribute("text-anchor", "middle");
        textoSvg.setAttribute("dominant-baseline", "central");
        textoSvg.textContent = p.simbolo;

        camada.appendChild(textoSvg);

        // 3. Renderiza o texto do resultado abaixo
        divResultado.innerHTML += `<p><strong>${p.nome}</strong> (${p.simbolo}): ${p.graus.toFixed(2)}° do Zodíaco</p>`;
      });
    }
  </script>
</body>
</html>
