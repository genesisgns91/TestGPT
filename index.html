<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Astral de Alta Precisão</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            color: #58a6ff;
        }

        .controls {
            background: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            max-width: 650px;
            width: 100%;
            justify-content: center;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 130px;
        }

        .input-group.full-width {
            flex: 100%;
        }

        label {
            font-size: 0.85rem;
            color: #8b949e;
        }

        input, select {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #58a6ff;
        }

        .location-box {
            display: flex;
            gap: 8px;
        }

        .location-box input {
            flex: 1;
        }

        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background-color: #30363d;
        }

        .btn-primary {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        .canvas-container {
            position: relative;
            width: 500px;
            height: 500px;
            margin-bottom: 30px;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .results {
            width: 100%;
            max-width: 700px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #30363d;
        }

        th {
            color: #58a6ff;
            font-weight: 600;
        }

        tr:hover {
            background-color: #21262d;
        }

        .symbol {
            font-size: 1.2rem;
            margin-right: 8px;
        }

        .status-msg {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h1>Mapa Astral de Alta Precisão</h1>

    <div class="controls">
        <div class="input-group">
            <label for="date">Data de Nascimento</label>
            <input type="date" id="date" value="1991-01-25">
        </div>
        <div class="input-group">
            <label for="time">Horário Local</label>
            <input type="time" id="time" value="17:10">
        </div>
        <div class="input-group">
            <label for="tz">Fuso / H. Verão</label>
            <select id="tz">
                <option value="-3">UTC-3 (Oficial)</option>
                <option value="-2" selected>UTC-2 (H. Verão)</option>
                <option value="-4">UTC-4</option>
                <option value="0">UTC+0 (GMT)</option>
            </select>
        </div>

        <div class="input-group full-width">
            <label for="citySearch">Cidade, Estado e País</label>
            <div class="location-box">
                <input type="text" id="citySearch" placeholder="Ex: Curitiba, PR, Brasil" value="Curitiba, PR, Brasil">
                <button type="button" class="btn-secondary" onclick="usarGPS()">📍 Usar GPS</button>
            </div>
            <div id="statusMsg" class="status-msg">Pronto.</div>
        </div>

        <input type="hidden" id="lat" value="-25.4284">
        <input type="hidden" id="lon" value="-49.2733">

        <button class="btn-primary" onclick="processarEMapa()">Gerar Mapa</button>
    </div>

    <div class="canvas-container">
        <canvas id="astroCanvas" width="500" height="500"></canvas>
    </div>

    <div class="results">
        <table>
            <thead>
                <tr>
                    <th>Astro</th>
                    <th>Posição Zodiacal</th>
                    <th>Signo</th>
                    <th>Casa</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </div>

    <script>
        const SIGNOS = [
            { nome: "Áries", simbolo: "♈" },
            { nome: "Touro", simbolo: "♉" },
            { nome: "Gêmeos", simbolo: "♊" },
            { nome: "Câncer", simbolo: "♋" },
            { nome: "Leão", simbolo: "♌" },
            { nome: "Virgem", simbolo: "♍" },
            { nome: "Libras", simbolo: "♎" },
            { nome: "Escorpião", simbolo: "♏" },
            { nome: "Sagitário", simbolo: "♐" },
            { nome: "Capricórnio", simbolo: "♑" },
            { nome: "Aquário", simbolo: "♒" },
            { nome: "Peixes", simbolo: "♓" }
        ];

        const bgImage = new Image();
        bgImage.src = 'roda.png';

        function degToRad(deg) { return deg * Math.PI / 180; }
        function radToDeg(rad) { return rad * 180 / Math.PI; }
        function normalizar(graus) {
            graus = graus % 360;
            return graus < 0 ? graus + 360 : graus;
        }

        // Algoritmo Keplereano Nativo para Cálculo Planetário
        function calcularPosicaoPlaneta(planetKey, d) {
            // Elementos Orbitais (J2000)
            const elements = {
                Sun:     { N: 0.0,      i: 0.0,     w: 282.9404 + 4.70935e-5*d, a: 1.000000, e: 0.016709 - 1.151e-9*d, M: 356.0470 + 0.9856002585*d },
                Moon:    { N: 125.1228 - 0.0529538083*d, i: 5.1454, w: 318.0634 + 0.1643573223*d, a: 60.2666, e: 0.054900, M: 115.3654 + 13.0649929509*d },
                Mercury: { N: 48.3313 + 3.24587e-5*d, i: 7.0047 + 5.00e-8*d, w: 29.1241 + 1.01444e-5*d, a: 0.387098, e: 0.205635 + 5.59e-10*d, M: 168.6562 + 4.0923344368*d },
                Venus:   { N: 76.6799 + 2.46590e-5*d, i: 3.3946 + 2.75e-8*d, w: 54.8910 + 1.38374e-5*d, a: 0.723330, e: 0.006773 - 1.302e-9*d, M: 48.0052 + 1.6021302244*d },
                Mars:    { N: 49.5574 + 2.11081e-5*d, i: 1.8497 - 1.78e-8*d, w: 286.5016 + 2.92961e-5*d, a: 1.523688, e: 0.093405 + 2.516e-9*d, M: 18.6021 + 0.5240207766*d },
                Jupiter: { N: 100.4542 + 2.76854e-5*d, i: 1.3030 - 1.557e-7*d, w: 273.8777 + 1.64505e-5*d, a: 5.20256, e: 0.048498 + 4.469e-9*d, M: 19.8950 + 0.0830853001*d },
                Saturn:  { N: 113.6655 + 2.38980e-5*d, i: 2.4886 - 1.081e-7*d, w: 339.3939 + 2.97661e-5*d, a: 9.55475, e: 0.055546 - 9.499e-9*d, M: 316.9670 + 0.0334442282*d },
                Uranus:  { N: 74.0005 + 1.3978e-5*d, i: 0.7733 + 1.9e-8*d, w: 96.6612 + 3.0565e-5*d, a: 19.18171 - 1.55e-8*d, e: 0.047318 + 7.45e-9*d, M: 142.5905 + 0.011725806*d },
                Neptune: { N: 131.7806 + 3.0173e-5*d, i: 1.7700 - 2.55e-7*d, w: 272.8461 - 6.027e-6*d, a: 30.05826 + 3.313e-8*d, e: 0.008606 + 2.15e-9*d, M: 260.2471 + 0.005995147*d },
                Pluto:   { N: 110.3034 - 1.0385e-5*d, i: 17.14175, w: 113.7634 + 3.0295e-5*d, a: 39.48168, e: 0.248807, M: 14.882 + 0.003960*d }
            };

            const p = elements[planetKey];
            let M = normalizar(p.M);
            let radM = degToRad(M);

            // Anomalia Excêntrica (Iteração de Kepler)
            let E = radM + p.e * Math.sin(radM) * (1.0 + p.e * Math.cos(radM));
            for(let iter=0; iter<5; iter++) {
                E = E - (E - p.e * Math.sin(E) - radM) / (1.0 - p.e * Math.cos(E));
            }

            let x = p.a * (Math.cos(E) - p.e);
            let y = p.a * Math.sqrt(1.0 - p.e * p.e) * Math.sin(E);

            let r = Math.sqrt(x*x + y*y);
            let v = Math.atan2(y, x);

            let lonHelio = normalizar(radToDeg(v) + p.w);

            if (planetKey === "Sun") {
                return normalizar(lonHelio + 180);
            }
            if (planetKey === "Moon") {
                // Perturbações da Lua
                let Ls = normalizar(elements.Sun.M + elements.Sun.w);
                let Lm = normalizar(M + p.w + p.N);
                let D = normalizar(Lm - Ls);
                let F = normalizar(Lm - p.N);

                let dLon = -1.274 * Math.sin(degToRad(M - 2*D))
                           + 0.658 * Math.sin(degToRad(2*D))
                           - 0.186 * Math.sin(degToRad(elements.Sun.M))
                           - 0.059 * Math.sin(degToRad(2*M - 2*D));
                return normalizar(lonHelio + p.N + dLon);
            }

            // Conversão de Heliocêntrico para Geocêntrico
            let sunLon = calcularPosicaoPlaneta("Sun", d);
            let radSunLon = degToRad(sunLon);
            let xs = Math.cos(radSunLon);
            let ys = Math.sin(radSunLon);

            let radPlanetLon = degToRad(lonHelio);
            let xp = r * Math.cos(radPlanetLon);
            let yp = r * Math.sin(radPlanetLon);

            let xg = xp + xs;
            let yg = yp + ys;

            return normalizar(radToDeg(Math.atan2(yg, xg)));
        }

        async function buscarCoordenadas(cidade) {
            const status = document.getElementById('statusMsg');
            status.textContent = "Buscando localização...";
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cidade)}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    document.getElementById('lat').value = data[0].lat;
                    document.getElementById('lon').value = data[0].lon;
                    status.textContent = `Localizado: ${data[0].display_name.split(',')[0]}`;
                    return true;
                }
            } catch (err) {}
            status.textContent = "Usando localização padrão.";
            return false;
        }

        function usarGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById('lat').value = pos.coords.latitude;
                    document.getElementById('lon').value = pos.coords.longitude;
                    document.getElementById('citySearch').value = "Minha Localização Atual";
                    calcularMapa();
                });
            }
        }

        async function processarEMapa() {
            const cidade = document.getElementById('citySearch').value;
            if (cidade && cidade !== "Minha Localização Atual") {
                await buscarCoordenadas(cidade);
            }
            calcularMapa();
        }

        function calcularAngulos(d, lat, lon) {
            // Tempo Sideral em Greenwich
            let GMST0 = normalizar(280.46061837 + 360.98564736629 * d);
            let LST = normalizar(GMST0 + lon);

            let radLST = degToRad(LST);
            let radLat = degToRad(lat);
            let obliq = degToRad(23.4393);

            // Meio do Céu (MC)
            let mc = radToDeg(Math.atan2(Math.sin(radLST), Math.cos(radLST) * Math.cos(obliq)));
            mc = normalizar(mc);

            // Ascendente (AC)
            let y = Math.cos(radLST);
            let x = -Math.sin(radLST) * Math.cos(obliq) - Math.tan(radLat) * Math.sin(obliq);
            let asc = radToDeg(Math.atan2(y, x));
            asc = normalizar(asc);

            return { asc, mc };
        }

        function calcularMapa() {
            const status = document.getElementById('statusMsg');

            const dateVal = document.getElementById('date').value;
            const timeVal = document.getElementById('time').value;
            const tzOffset = parseFloat(document.getElementById('tz').value);
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);

            if (!dateVal || !timeVal) return;

            const [year, month, day] = dateVal.split('-').map(Number);
            const [hours, minutes] = timeVal.split(':').map(Number);

            // Data UTC
            const utcTime = Date.UTC(year, month - 1, day, hours - tzOffset, minutes);
            const dateObj = new Date(utcTime);

            // Dias desde Época J2000.0
            const d = (dateObj.getTime() - Date.UTC(2000, 0, 1, 12, 0, 0)) / 86400000;

            const { asc, mc } = calcularAngulos(d, lat, lon);

            const ASTROS_LISTA = [
                { id: "Sun", nome: "Sol", simbolo: "☉", cor: "#ffd700" },
                { id: "Moon", nome: "Lua", simbolo: "☽", cor: "#e6e6fa" },
                { id: "Mercury", nome: "Mercúrio", simbolo: "☿", cor: "#b0c4de" },
                { id: "Venus", nome: "Vênus", simbolo: "♀", cor: "#ffb6c1" },
                { id: "Mars", nome: "Marte", simbolo: "♂", cor: "#ff4500" },
                { id: "Jupiter", nome: "Júpiter", simbolo: "♃", cor: "#ffa500" },
                { id: "Saturn", nome: "Saturno", simbolo: "♄", cor: "#daa520" },
                { id: "Uranus", nome: "Urano", simbolo: "♅", cor: "#7fffd4" },
                { id: "Neptune", nome: "Netuno", simbolo: "♆", cor: "#1e90ff" },
                { id: "Pluto", nome: "Plutão", simbolo: "♇", cor: "#9370db" }
            ];

            const posicoes = ASTROS_LISTA.map(astro => {
                const lonEcliptica = calcularPosicaoPlaneta(astro.id, d);
                const signoIndex = Math.floor(lonEcliptica / 30);
                const grauNoSigno = lonEcliptica % 30;

                const diffAsc = normalizar(lonEcliptica - asc);
                const casa = Math.floor(diffAsc / 30) + 1;

                return {
                    ...astro,
                    grauAbsoluto: lonEcliptica,
                    signo: SIGNOS[signoIndex],
                    grauNoSigno: grauNoSigno,
                    casa: casa
                };
            });

            desenharCanvas(posicoes);
            preencherTabela(posicoes, asc, mc);
            status.textContent = "Mapa gerado com sucesso!";
        }

        function desenharCanvas(posicoes) {
            const canvas = document.getElementById('astroCanvas');
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const raioPlanetas = 160;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }

            posicoes.forEach(astro => {
                let anguloRad = (astro.grauAbsoluto - 90) * (Math.PI / 180);
                let x = cx + raioPlanetas * Math.cos(anguloRad);
                let y = cy + raioPlanetas * Math.sin(anguloRad);

                ctx.beginPath();
                ctx.arc(x, y, 13, 0, 2 * Math.PI);
                ctx.fillStyle = '#0d1117';
                ctx.fill();
                ctx.strokeStyle = astro.cor;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = astro.cor;
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(astro.simbolo, x, y);
            });
        }

        function formatarGraus(grausDecimal) {
            const g = Math.floor(grausDecimal);
            const m = Math.floor((grausDecimal - g) * 60);
            const s = Math.floor((((grausDecimal - g) * 60) - m) * 60);
            return `${g}° ${m.toString().padStart(2, '0')}' ${s.toString().padStart(2, '0')}"`;
        }

        function preencherTabela(posicoes, asc, mc) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // 1. Ascendente
            const ascIndex = Math.floor(asc / 30);
            const trAsc = document.createElement('tr');
            trAsc.style.fontWeight = "bold";
            trAsc.style.color = "#58a6ff";
            trAsc.innerHTML = `
                <td><span class="symbol">AC</span> Ascendente</td>
                <td>${formatarGraus(asc % 30)} ${SIGNOS[ascIndex].simbolo}</td>
                <td>${SIGNOS[ascIndex].nome}</td>
                <td>Casa 1</td>
            `;
            tbody.appendChild(trAsc);

            // 2. Meio do Céu
            const mcIndex = Math.floor(mc / 30);
            const trMc = document.createElement('tr');
            trMc.style.fontWeight = "bold";
            trMc.style.color = "#58a6ff";
            trMc.innerHTML = `
                <td><span class="symbol">MC</span> Meio do Céu</td>
                <td>${formatarGraus(mc % 30)} ${SIGNOS[mcIndex].simbolo}</td>
                <td>${SIGNOS[mcIndex].nome}</td>
                <td>Casa 10</td>
            `;
            tbody.appendChild(trMc);

            // 3. Planetas
            posicoes.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="symbol" style="color:${p.cor}">${p.simbolo}</span> ${p.nome}</td>
                    <td>${formatarGraus(p.grauNoSigno)} ${p.signo.simbolo}</td>
                    <td>${p.signo.nome}</td>
                    <td>Casa ${p.casa}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = () => {
            bgImage.onload = () => calcularMapa();
            if (bgImage.complete) calcularMapa();
        };
    </script>
</body>
</html>
